

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM - Change Box Color</title>
  <style>
    body { 
      background: #111; 
      color: #fff; 
      font-family: Arial; 
      text-align: center; 
      padding: 50px; 
    }
    #box {
      width: 150px;
      height: 50px;
      background-color: gray; /* Initial box color */
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Changing CSS Styles Using DOM</h1>
  
  <!-- The box/button -->
  <button id="box" onclick="changeColor()">Click Me</button>
  
  <script>
    // Function runs when button is clicked
    function changeColor(){
      // DOM selects the box and changes background to green
      document.getElementById("box").style.backgroundColor = "green";
      document.getElementById("box").innerText = "Box is black";
    }
  </script>
</body>
</html>
